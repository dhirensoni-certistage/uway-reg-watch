name: veda-female-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veda-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check count
        run: python check_female.py
        env:
          VEDA_TOKEN: ${{ secrets.VEDA_TOKEN }}
          VEDA_CF: ${{ secrets.VEDA_CF }}
          NTFY_URL: ${{ secrets.NTFY_URL }}

      - name: Save state
        if: always()
        run: |
          git config user.name "veda-bot"
          git config user.email "veda-bot@users.noreply.github.com"
          if [ -f veda_state.json ]; then
            git add veda_state.json
            if ! git diff --cached --quiet; then
              git commit -m "state: $(date -u +%H:%M) [skip ci]"
              git pull --rebase
              git push
            fi
          fi